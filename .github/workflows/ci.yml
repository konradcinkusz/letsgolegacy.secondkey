name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # In CI a missing Docker or browser is a failure, never a silent skip (analysis A1, A2).
  SK_REQUIRE_DOCKER: "1"
  SK_REQUIRE_PDF: "1"

jobs:
  build-test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore SecondKey.slnx
      - name: Build
        run: dotnet build SecondKey.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test SecondKey.slnx --no-build --configuration Release --logger "trx" --results-directory TestResults
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/

  mutation:
    # One job per mutation-tested project, in parallel: the verdict path grew to four
    # projects, and one after another they would outlast the rest of CI several times over.
    name: mutation testing (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        project: [Artifacts, Contract, Compare, Evidence]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Mutation testing
        run: ./scripts/mutation.sh ${{ matrix.project }}
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.project }}
          path: StrykerOutput/
          if-no-files-found: ignore
