name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # In CI a missing Docker or browser is a failure, never a silent skip (analysis A1, A2).
  SK_REQUIRE_DOCKER: "1"
  SK_REQUIRE_PDF: "1"

jobs:
  build-test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore SecondKey.slnx
      - name: Build
        run: dotnet build SecondKey.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test SecondKey.slnx --no-build --configuration Release --logger "trx" --results-directory TestResults
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults/

  mutation:
    name: mutation testing (Stryker.NET threshold)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Mutation testing
        run: ./scripts/mutation.sh
      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutation-reports
          path: StrykerOutput/
          if-no-files-found: ignore
