version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      test-stack:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The documentation PDF's Mermaid renderer (package.json); nothing in the product uses npm.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
